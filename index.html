    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --card: #0f0f0f;
      --border: #222;
      --text: #c7d5e0;
      --muted: #6b7280;
      --accent: #e11d48;
      --glow: rgba(225, 29, 72, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', "Motiva Sans", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .page-wrapper {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 24px 80px;
      min-height: 100vh;
    }

      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 140px;
      height: 75vh;
      max-height: 580px;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: fadeInSide 1.8s ease-out 0.3s forwards, float 8s ease-in-out infinite;

    @keyframes float {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      50% { transform: translateY(-52%) translateX(3px); }
    }

    @keyframes fadeInSide {
      from { opacity: 0; filter: blur(4px); }
      to { opacity: 0.92; filter: blur(0); }
    }

    /* Main content */
    .profile-container {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Entrance animations */
    .anim {
      opacity: 0;
      transform: translateY(18px);
      animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-1 { animation-delay: 0.15s; }
    .anim-2 { animation-delay: 0.28s; }
    .anim-3 { animation-delay: 0.42s; }
    .anim-4 { animation-delay: 0.55s; }
    .anim-5 { animation-delay: 0.68s; }
    .anim-6 { animation-delay: 0.82s; }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .profile-header {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 36px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border: 1px solid #333;
      background: #080808;
      overflow: hidden;
      flex-shrink: 0;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .avatar:hover {
      border-color: #555;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .avatar:hover img {
      transform: scale(1.05);
    }

    .profile-info {
      flex: 1;
      padding-top: 4px;
    }

    .username {
      font-size: 28px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .status-line {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .status-line .red {
      color: #e11d48;
      font-weight: 500;
    }

    /* Section titles */
    .section-title {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 14px;
      letter-spacing: 0.2px;
      font-weight: 400;
    }

    .section {
      margin-bottom: 32px;
    }

    /* Achievement boxes */
    .achievements-row {
      display: flex;
      gap: 7px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .ach-box {
      width: 52px;
      height: 52px;
      background: #121212;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #e5e5e5;
      letter-spacing: 0.5px;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: default;
    }

    .ach-box:hover {
      background: #1a1a1a;
      border-color: #444;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      color: #fff;
    }

    .ach-box.tiger {
      font-size: 24px;
    }

    .ach-box.tiger:hover {
      color: #f43f5e;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }

    .stats-row {
      display: flex;
      gap: 36px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 300;
      color: #fff;
      display: block;
      letter-spacing: -0.3px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 2px;
    }

    .right-stats {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-left: auto;
      text-align: right;
      font-size: 12.5px;
      color: var(--muted);
    }

    .right-stats span {
      color: #d1d5db;
      font-weight: 500;
    }

    /* Guide card */
    .guide-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #111;
      border: 1px solid #222;
      padding: 12px 16px;
      max-width: 440px;
      transition: all 0.3s ease;
    }

    .guide-card:hover {
      border-color: #333;
      background: #141414;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .guide-thumb {
      width: 74px;
      height: 44px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      flex-shrink: 0;
    }

    .guide-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .guide-card:hover .guide-thumb img {
      opacity: 1;
    }

    .guide-title {
      font-size: 13.5px;
      color: #f3f4f6;
      margin-bottom: 3px;
      font-weight: 400;
    }

    .guide-meta {
      font-size: 11.5px;
      color: var(--muted);
    }

    .stars {
      color: #60a5fa;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* Big showcase */
    .showcase-image {
      margin: 8px 0 4px;
      border: 1px solid #1f1f1f;
      background: #080808;
      max-width: 100%;
      overflow: hidden;
      position: relative;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .showcase-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 70%, rgba(0,0,0,0.4));
      pointer-events: none;
    }

    .showcase-image:hover {
      border-color: #333;
      box-shadow: 0 0 40px rgba(225, 29, 72, 0.08);
    }

    .showcase-image img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 290px;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .showcase-image:hover img {
      transform: scale(1.02);
    }

    /* Captures */
    .captures-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .capture-item {
      width: 175px;
      height: 110px;
      background: #0d0d0d;
      border: 1px solid #1f1f1f;
      overflow: hidden;
      position: relative;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .capture-item:hover {
      border-color: #3a3a3a;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }

    .capture-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .capture-item:hover img {
      transform: scale(1.06);
    }

    .capture-item.dark img {
      filter: brightness(0.7);
    }

    .capture-item.dark:hover img {
      filter: brightness(0.85);
    }

    /* Bottom */
    .bottom-bar {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #151515;
      font-size: 11px;
      color: #333;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 960px) {
      .side-deco {
        width: 90px;
        opacity: 0.6;
      }
    }

    @media (max-width: 700px) {
      .side-deco {
        display: none;
      }

      .page-wrapper {
        padding: 28px 16px 50px;
      }

      .username {
        font-size: 24px;
      }

      .avatar {
        width: 60px;
        height: 60px;
      }

      .ach-box {
        width: 44px;
        height: 44px;
        font-size: 17px;
      }

      .ach-box.tiger {
        font-size: 20px;
      }

      .stats-row {
        gap: 22px;
      }

      .stat-value {
        font-size: 20px;
      }

      .right-stats {
        margin-left: 0;
        text-align: left;
        width: 100%;
        margin-top: 12px;
        flex-direction: row;
        gap: 18px;
      }

      .capture-item {
        width: calc(50% - 6px);
        height: 100px;
      }

      .guide-card {
        max-width: 100%;
      }
    }

    @media (max-width: 400px) {
      .achievements-row {
        gap: 5px;
      }
      .ach-box {
        width: 38px;
        height: 38px;
        font-size: 15px;
      }
      .ach-box.tiger {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="side-deco left"></div>
  <div class="side-deco right"></div>

  <div class="page-wrapper">
    <div class="profile-container">

      <!-- Profile Header -->

  <script>
    // Optional: gentle parallax on mouse move for side decorations (desktop only)
    if (window.innerWidth > 900) {
      document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 12;
        const y = (e.clientY / window.innerHeight - 0.5) * 8;
        
        const left = document.querySelector('.side-deco.left');
        const right = document.querySelector('.side-deco.right');
        
        if (left) left.style.transform = `translateY(calc(-50% + ${y}px)) translateX(${x * 0.4}px)`;
        if (right) right.style.transform = `translateY(calc(-50% + ${-y}px)) translateX(${-x * 0.4}px)`;
      });
    }
  </script>
