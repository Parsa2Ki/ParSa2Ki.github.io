<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>annx_ | Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #c7d5e0;
      font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.4;
    }

    .page-wrapper {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      min-height: 100vh;
    }

    /* Side decorations */
    .side-deco {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 140px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.9;
    }

    .side-deco.left {
      left: 0;
      background: url('left_deco.png') no-repeat center left;
      background-size: contain;
    }

    .side-deco.right {
      right: 0;
      background: url('right_deco.png') no-repeat center right;
      background-size: contain;
    }

    /* Main content */
    .profile-container {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Header / Profile info */
    .profile-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 30px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border: 1px solid #3a3a3a;
      background: #1b2838;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(30%);
    }

    .profile-info {
      flex: 1;
    }

    .username {
      font-size: 26px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .status-line {
      font-size: 12px;
      color: #8f98a0;
      margin-bottom: 2px;
    }

    .status-line .red {
      color: #c44;
    }

    /* Section titles */
    .section-title {
      font-size: 13px;
      color: #8f98a0;
      text-transform: none;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .section {
      margin-bottom: 28px;
    }

    /* Achievement Showcase */
    .achievements-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .ach-box {
      width: 52px;
      height: 52px;
      background: #1b2838;
      border: 1px solid #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .ach-box.tiger {
      font-size: 26px;
    }

    .stats-row {
      display: flex;
      gap: 32px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: left;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 300;
      color: #fff;
      display: block;
    }

    .stat-label {
      font-size: 11px;
      color: #8f98a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .right-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: auto;
      text-align: right;
      font-size: 12px;
      color: #8f98a0;
    }

    .right-stats span {
      color: #c7d5e0;
    }

    /* Favorite Guide */
    .guide-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1b2838;
      border: 1px solid #2a2a2a;
      padding: 10px 14px;
      max-width: 420px;
    }

    .guide-thumb {
      width: 64px;
      height: 40px;
      background: #0e141b;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .guide-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.7;
    }

    .guide-info {
      flex: 1;
    }

    .guide-title {
      font-size: 13px;
      color: #fff;
      margin-bottom: 2px;
    }

    .guide-meta {
      font-size: 11px;
      color: #8f98a0;
    }

    .stars {
      color: #66c0f4;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* Big showcase image */
    .showcase-image {
      margin: 20px 0;
      border: 1px solid #2a2a2a;
      background: #0e141b;
      max-width: 100%;
      overflow: hidden;
    }

    .showcase-image img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 320px;
      object-fit: cover;
      object-position: center top;
    }

    /* Captures section */
    .captures-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .capture-item {
      width: 160px;
      height: 100px;
      background: #1b2838;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
    }

    .capture-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .capture-item.dark img {
      filter: brightness(0.7);
    }

    /* Footer-ish */
    .bottom-bar {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #1a1a1a;
      font-size: 11px;
      color: #4a4a4a;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .side-deco {
        width: 80px;
        opacity: 0.5;
      }
      .profile-container {
        max-width: 100%;
      }
    }

    @media (max-width: 600px) {
      .side-deco {
        display: none;
      }

      .page-wrapper {
        padding: 20px 12px 40px;
      }

      .profile-header {
        gap: 12px;
      }

      .avatar {
        width: 56px;
        height: 56px;
      }

      .username {
        font-size: 22px;
      }

      .ach-box {
        width: 42px;
        height: 42px;
        font-size: 18px;
      }

      .ach-box.tiger {
        font-size: 20px;
      }

      .stats-row {
        gap: 20px;
      }

      .stat-value {
        font-size: 18px;
      }

      .right-stats {
        margin-left: 0;
        text-align: left;
        width: 100%;
        margin-top: 8px;
      }

      .capture-item {
        width: calc(50% - 6px);
        height: 90px;
      }

      .guide-card {
        max-width: 100%;
      }
    }

    @media (max-width: 400px) {
      .achievements-row {
        gap: 4px;
      }
      .ach-box {
        width: 36px;
        height: 36px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="side-deco left"></div>
  <div class="side-deco right"></div>

  <div class="page-wrapper">
    <div class="profile-container">

      <!-- Profile Header -->
      <div class="profile-header">
        <div class="avatar">
          <img src="avatar.png" alt="Avatar">
        </div>
        <div class="profile-info">
          <div class="username">annx_</div>
          <div class="status-line"><span class="red">the process (me)</span></div>
          <div class="status-line">online</div>
        </div>
      </div>

      <!-- Achievement Showcase -->
      <div class="section">
        <div class="section-title">Expositor de logros</div>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
          <div>
            <div class="achievements-row">
              <div class="ach-box">K</div>
              <div class="ach-box">A</div>
              <div class="ach-box">N</div>
              <div class="ach-box">E</div>
              <div class="ach-box">K</div>
              <div class="ach-box">I</div>
              <div class="ach-box tiger">虎</div>
            </div>

            <div class="stats-row">
              <div class="stat">
                <span class="stat-value">12,144</span>
                <span class="stat-label">Logros</span>
              </div>
              <div class="stat">
                <span class="stat-value">12</span>
                <span class="stat-label">Juegos completados</span>
              </div>
              <div class="stat">
                <span class="stat-value">49%</span>
                <span class="stat-label">Media de obtención</span>
              </div>
            </div>
          </div>

          <div class="right-stats">
            <div>Inventario <span>4</span></div>
            <div>Capturas <span>2</span></div>
            <div>Artwork <span>2</span></div>
          </div>
        </div>
      </div>

      <!-- Favorite Guide -->
      <div class="section">
        <div class="section-title">Guía favorita</div>
        <div class="guide-card">
          <div class="guide-thumb">
            <img src="small_capture.png" alt="Guide">
          </div>
          <div class="guide-info">
            <div class="guide-title">Creado por · mentally i'm here</div>
            <div class="guide-meta">
              <span class="stars">★★★★★</span> 137 valoraciones
            </div>
          </div>
        </div>
      </div>

      <!-- Big Showcase -->
      <div class="section">
        <div class="showcase-image">
          <img src="kaneki.png" alt="I'm dead inside">
        </div>
      </div>

      <!-- Captures Showcase -->
      <div class="section">
        <div class="section-title">Expositor de capturas</div>
        <div class="captures-row">
          <div class="capture-item">
            <img src="hands.png" alt="Hands">
          </div>
          <div class="capture-item dark">
            <img src="small_capture.png" alt="Capture">
          </div>
        </div>
      </div>

      <div class="bottom-bar">
        Profile recreation · Dark theme · Responsive
      </div>
    </div>
  </div>
</body>
</html>
